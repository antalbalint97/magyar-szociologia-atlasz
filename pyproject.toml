[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szocatlas"
version = "0.1.0"
description = "Magyar Szociológia Atlasz: a provenance-aware knowledge graph of Hungarian sociology"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "PyYAML>=6.0",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
analysis = ["networkx>=3.2", "pandas>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
szocatlas = "szocatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
szocatlas = ["graph/cypher/*.cypher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["neo4j: needs a running Neo4j (set NEO4J_URI)"]

[tool.ruff]
line-length = 100
target-version = "py311"
