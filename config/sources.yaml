  - {source_id: szte_sociology, institution: szte, unit_name: SZTE BTK Szociológia Tanszék, unit_english_name: Department of Sociology, unit_type: department, base_url: "https://arts.u-szeged.hu/szociologia-tanszek", verified: true, notes: "12 staff with research areas; each links an MTMT record (hard identifier). Szeged Studies long-running project. u-szeged.hu robots: Crawl-delay 1."}
