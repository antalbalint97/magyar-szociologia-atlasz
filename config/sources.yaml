sources:
  # ---------------------------------------------------------------- TK ecosystem
  # All TK institute sites observed so far share one CMS: researcher listings at
  # /kutatok (paginated ?page=N, letter filters /kutatok/<letter>) and profiles at
  # /kutato/<slug>. One adapter ("tk") serves them all, configured per site.
  - source_id: tk_szociologia
    institution: elte_tk
    unit_name: TK Szociológiai Intézet
    unit_english_name: Institute for Sociology
    unit_type: institute
    base_url: https://szociologia.tk.elte.hu
    host_aliases: [szociologia.tk.hu, szociologia.tk.mta.hu]
    adapter: tk
    enabled: true
    verified: true
    adapter_config:
      institute_code: SZI
      people_listing: /kutatok
      units:
        - {path: /csalad-es-tarsas-kapcsolatok, unit_type: research_department}
        - {path: /tarsadalom-es-kozpolitika-osztaly, unit_type: research_department}
        - {path: /tarsadalmi-integracio-es-egyenlotlensegek, unit_type: research_department}
      project_listings:
        - {path: /kategoria/futo-kutatasok, status_label: futó}
        - {path: /kategoria/lezart-kutatasok, status_label: lezárt}
    notes: Datasets link points to openarchive.tk.mta.hu (division SZI).

  - source_id: tk_recens
    institution: elte_tk
    unit_name: TK Számítógépes Társadalomtudomány - CSS-RECENS
    unit_english_name: Computational Social Science - Research Center for Educational and Network Studies (CSS-RECENS)
    unit_type: research_centre
    base_url: https://recens.tk.elte.hu
    host_aliases: [recens.tk.hu, recens.tk.mta.hu]
    adapter: tk
    enabled: true
    verified: true
    adapter_config:
      institute_code: Recens
      people_listing: /kutatok
      units: []
      project_listings: []
    notes: >
      Koltai Júlia, Kmetty Zoltán, Kisfalusi Dorottya, Janky Béla and Keller Tamás are
      listed here, not under the Sociology Institute (observed 2026-10-04). English
      pages under /en/ list research groups incl. the MTA–TK Lendület DS4 group;
      group pages need a dedicated parser (next step).

  - source_id: tk_kisebbsegkutato
    institution: elte_tk
    unit_name: TK Kisebbségkutató Intézet
    unit_english_name: Institute for Minority Studies
    unit_type: institute
    base_url: https://kisebbsegkutato.tk.elte.hu
    host_aliases: [kisebbsegkutato.tk.hu, kisebbsegkutato.tk.mta.hu]
    adapter: tk
    enabled: true
    verified: true
    adapter_config:
      institute_code: KI
      people_listing: /kutatok
      units:
        - {path: /kisebbsegszociologiai-es-antropologiai-osztaly, unit_type: research_department}
        - {path: /kisebbsegtorteneti-es-etnopolitikai-osztaly, unit_type: research_department}
      project_listings: []
    notes: >
      Department URLs confirmed from the site menu (2026-10-04). Research is listed
      under thematic pages (Identitáspolitika, Roma tárgyú kutatások, ...) rather than a
      project category, so no project listing is configured yet.

  - source_id: tk_politikatudomany
    institution: elte_tk
    unit_name: TK Politikatudományi Intézet
    unit_english_name: Institute for Political Science
    unit_type: institute
    base_url: https://politikatudomany.tk.elte.hu
    host_aliases: [politikatudomany.tk.hu, politikatudomany.tk.mta.hu]
    adapter: tk
    enabled: true
    verified: true
    scope: adjacent
    adapter_config:
      institute_code: PTI
      people_listing: /kutatok
      units:
        - {path: /demokracia-es-politikaelmeleti-osztaly, unit_type: research_department}
        - {path: /kormanyzas-es-kozpolitika-osztaly, unit_type: research_department}
        - {path: /politikai-viselkedes-osztaly, unit_type: research_department}
      project_listings:
        - {path: /kategoria/futo-kutatasi-projektek, status_label: futó}
    notes: Paths confirmed from the site menu on the first live crawl (2026-10-04).

  - source_id: tk_jog
    institution: elte_tk
    unit_name: TK Jogtudományi Intézet
    unit_english_name: Institute for Legal Studies
    unit_type: institute
    base_url: https://jog.tk.elte.hu
    host_aliases: [jog.tk.hu, jog.tk.mta.hu]
    adapter: tk
    enabled: false
    verified: false
    scope: adjacent
    adapter_config:
      institute_code: JTI
      people_listing: /kutatok
    notes: >
      Include only researchers with socio-legal overlap. Needs a scope filter
      (stated research areas) before enabling, so the graph does not absorb the
      whole law institute.

  # TK-hosted programmes and infrastructures on separate sites (different layouts).
  - {source_id: tk_ess, institution: elte_tk, unit_name: European Social Survey Magyarország, unit_type: infrastructure, base_url: "https://ess.tk.hu/", notes: "ESS Hungary national team. Adapter TBD."}
  - {source_id: tk_milab, institution: elte_tk, unit_name: Mesterséges Intelligencia Nemzeti Laboratórium (TK), unit_type: laboratory, base_url: "https://milab.tk.hu/hu", notes: "MILAB social-science groups. Adapter TBD."}
  - {source_id: tk_reprosoc, institution: elte_tk, unit_name: Reprodukciós Döntéseket Vizsgáló Lendület Kutatócsoport, unit_type: research_group, base_url: "https://reprosoc.tk.hu/", notes: "Lendület group site. Adapter TBD."}
  - {source_id: tk_hpops, institution: elte_tk, unit_name: Lendület-HPOPs Kutatócsoport, unit_type: research_group, base_url: "https://hpops.tk.hu/", notes: "Lendület group site. Adapter TBD."}
  - {source_id: tk_enl, institution: elte_tk, unit_name: Egészségbiztonság Nemzeti Laboratórium (TK társadalomtudományi kutatócsoport), unit_type: laboratory, base_url: "https://enl.tk.hu/", notes: "National Laboratory for Health Security. Adapter TBD."}
  - {source_id: tk_mobilitas, institution: elte_tk, unit_name: Mobilitás Kutatási Centrum, unit_type: research_centre, base_url: "https://tk.hun-ren.hu/mobilitas", notes: "Linked from tk.elte.hu under a tk.hun-ren.hu host. Adapter TBD."}
  - {source_id: tk_gyerekesely, institution: elte_tk, unit_name: Gyerekesély, unit_type: programme, base_url: "http://gyerekesely.tk.hu/", notes: "Child poverty programme (Ferge tradition candidate; do not assert). Adapter TBD."}
  - {source_id: tk_kdk, institution: elte_tk, unit_name: Kutatási Dokumentációs Központ, unit_type: infrastructure, base_url: "https://kdk.tk.hu/", notes: "Research Documentation Centre: survey data archive, relevant for project/data provenance."}
  - {source_id: tk_mokk, institution: elte_tk, unit_name: Módszertani Képzések, unit_type: programme, base_url: "https://mokk.tk.hu/"}
  - {source_id: tk_csaladtudomany, institution: elte_tk, unit_name: Családtudomány, unit_type: programme, base_url: "https://csaladtudomany.tk.hu/"}
  - {source_id: tk_klimacentrum, institution: elte_tk, unit_name: Klímacentrum, unit_type: research_centre, base_url: "https://klimacentrum.tk.hu"}
  - {source_id: journal_intersections, institution: elte_tk, unit_name: "Intersections. East European Journal of Society and Politics", source_type: journal, base_url: "https://intersections.tk.hu/", notes: "Journal published by TK. Editorial board -> EDITOR_OF edges."}
  - {source_id: tk_openarchive, institution: elte_tk, unit_name: TK Open Archive, source_type: repository, base_url: "https://openarchive.tk.mta.hu", notes: "EPrints repository; per-division and per-creator views. Candidate publication source."}

  # ------------------------------------------------- other institutions (no adapter yet)
  # Entry points observed 2026-10-04 through a text-rendering reader (not raw snapshots).
  # verified: true = the page loaded; false = seen only in search results or links.
  # Full per-source notes: docs/sources.md.
  - {source_id: elte_tatk_sociology, institution: elte_tatk, unit_name: ELTE TáTK Szociológia Intézet, unit_english_name: Institute of Sociology, unit_type: institute, base_url: "https://tatk.elte.hu/en/units/institute-of-sociology", verified: true, notes: "~25 staff in one list; department page /en/units/department-of-sociology; profiles /en/staff/<slug>. tatk.elte.hu robots.txt was unreachable from the reader: confirm before crawling."}
  - {source_id: elte_tatk_empirical, institution: elte_tatk, unit_name: ELTE TáTK Empirikus Tanulmányok Intézet, unit_english_name: Institute of Empirical Studies, unit_type: institute, base_url: "https://tatk.elte.hu/en/units/institute-of-empirical-studies", verified: true, notes: "Departments of Statistics and of Social Research Methodology; 29 people inline."}
  - {source_id: elte_krtk_rki, institution: elte_krtk, unit_name: KRTK Regionális Kutatások Intézete, unit_english_name: Institute for Regional Studies, unit_type: institute, base_url: "https://rki.krtk.hu/", verified: true, notes: "WordPress; robots open; sitemaps for kutatok (403 profiles), projektek, szervezeti_egysegek. Category korabbi-munkatarsak lists FORMER staff (historical evidence). Regional departments in Pécs, Budapest, Győr, Kecskemét, Békéscsaba. Best-structured candidate for the next adapter."}
  - {source_id: elte_krtk_kti, institution: elte_krtk, unit_name: KRTK Közgazdaság-tudományi Intézet, unit_english_name: Institute of Economics, unit_type: institute, base_url: "https://kti.krtk.hu/", scope: adjacent, notes: "Staff URLs unconfirmed (intermittent timeouts). Include researchers on inequality, education, Roma, labour, networks."}
  - {source_id: elte_krtk_vgi, institution: elte_krtk, unit_name: KRTK Világgazdasági Intézet, unit_english_name: Institute of World Economics, unit_type: institute, base_url: "http://www.vki.hu/", scope: adjacent, notes: "Timed out; low priority."}
  - {source_id: elte_krtk_adatbank, institution: elte_krtk, unit_name: KRTK Adatbank, unit_english_name: KRTK Data Bank, unit_type: infrastructure, base_url: "https://krtk.elte.hu/adatbank/", verified: true}
  - {source_id: tarki_web, institution: tarki, base_url: "https://tarki.hu/", verified: true, notes: "Drupal; staff on /rolunk (3 groups) with flat-slug profiles; projects at /kutatasok (?page=0..6) name 'Kutatásvezető' and team. robots: standard Drupal, no AI blocks."}
  - {source_id: tarki_adatbank, institution: tarki, source_type: data_archive, base_url: "https://adatbank.tarki.hu/en/", verified: true, notes: "CESSDA member, 800+ datasets; study metadata likely lists PIs (DDI)."}
  - {source_id: corvinus_sociology, institution: corvinus, unit_name: Corvinus Szociológia Tanszék, unit_english_name: Department of Sociology, unit_type: department, base_url: "https://www.uni-corvinus.hu/fooldal/egyetemunkrol/tanszekek/szociologia-tanszek/", verified: true, notes: "Inside the Társadalom- és Politikatudományi Intézet (no separate 'Szociológia és Társadalompolitika Intézet' any more). Staff page lists PhD students WITH supervisors (genealogy evidence) and MTMT/Scholar links; profiles /elerhetosegek/<slug>."}
  - {source_id: corvinus_tpi, institution: corvinus, unit_name: Corvinus Társadalom- és Politikatudományi Intézet, unit_english_name: Institute of Social and Political Sciences, unit_type: institute, base_url: "https://www.uni-corvinus.hu/fooldal/egyetemunkrol/intezetek/tarsadalom-es-politikatudomanyi-intezet/", verified: true}
  - {source_id: corvinus_etk, institution: corvinus, unit_name: Corvinus Empirikus Társadalomkutató Központ, unit_type: research_centre, base_url: "https://www.uni-corvinus.hu/fooldal/kutatas/kutatokozpontok/empirikus-tarsadalomkutato-kozpont/"}
  - {source_id: pte_sociology, institution: pte_btk, unit_name: PTE BTK Szociológia Tanszék, unit_english_name: Department of Sociology, unit_type: department, base_url: "https://btk.pte.hu/hu/szociologia", verified: true, notes: "15 staff at /hu/szociologia/oktatoink linking to faculty directory profiles /hu/munkatarsak/<slug>; Település és Társadalom research group; Demography and Sociology doctoral school."}
  - {source_id: pte_romology, institution: pte_btk, unit_name: PTE BTK Romológia és Nevelésszociológia Tanszék, unit_english_name: Department of Romology and Sociology of Education, unit_type: department, base_url: "https://btk.pte.hu/hu/nevtud/romologia-es-nevelesszociologia-tanszek", verified: true, notes: "In the Neveléstudományi Intézet; staff page /hu/node/15595 (9 people, no profile links). Model as potentially distinct from Budapest Roma-research networks (brief §3)."}
