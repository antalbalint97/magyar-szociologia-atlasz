# Manual identity decisions. Version-controlled; each entry needs reviewer + date.
# refs are source refs as they appear in review/unresolved_people.yaml.
#
# same_as:
#   - refs: ["tk_recens|https://recens.tk.elte.hu/kutato/x-y", "tk_szociologia|https://szociologia.tk.elte.hu/kutato/x-y"]
#     reviewer: <name>
#     date: 2026-10-04
#     evidence: "Both profiles link the same CV / same MTMT record"
#     survivor: per_...   # optional: the canonical id to keep when both records already have one
#                         # (default, ADR-0003: oldest assignment, then stronger anchor, then lowest id)
# not_same_as:
#   - refs: [...]
#     reviewer: <name>
#     date: ...
#     evidence: "..."
same_as:
  # #27: one person, two TK profiles served by one CMS record
  - refs:
      - "tk_recens|https://recens.tk.elte.hu/kutato/stefkovics-adam"
      - "tk_szociologia|https://szociologia.tk.elte.hu/kutato/stefkovics-adam"
    survivor: per_07c6bb757b
    reviewer: Bálint (antalbalint97)
    date: 2026-10-04
    evidence: >-
      Both profile pages (fetched 2026-10-04) link the same TK CMS record for the CV,
      /kutato/pdf/615 (https://recens.tk.elte.hu/kutato/pdf/615 and
      https://szociologia.tk.elte.hu/kutato/pdf/615), and state the same position
      "Tudományos segédmunkatárs (TK Recens)" and the same research areas. Same slug
      stefkovics-adam on both sites. Survivor per_07c6bb757b (recens profile): both ids were
      minted in the same build (no older id) and neither record has MTMT/ORCID (no stronger
      anchor); the position on both pages names TK Recens, so the recens profile is the
      home-unit record. per_405c6c90b1 is retired (previous_id in review/identity_map.jsonl).
      Issue #27.
not_same_as: []

# Project-mention decisions (ADR-0008, #7), review of the 8 REVIEW_REQUIRED mentions of 2026-10-tk-m2-p7.
# A same_as is an identity decision about the *mention*; it says nothing about what kind of activity the
# Project is (that is #9). `defer` holds a mention back without naming a Project: identity is plausible,
# the canonical entity type is undecided. Every entry records what the automatic rules saw
# (resolution.evidence.signals_seen), including the blocking signal a reviewer overruled.
project_decisions:
  # ReproSoc: the profile list item links the project's own site (reprosoc.tk.hu), which the resolver
  # reads as "links another page". The reviewer reads it as the dedicated site of the same activity.
  - mention_id: pjm_851a37e708   # Galántai Júlia, szociologia profile, tk_reprosoc|https://reprosoc.tk.hu/
    project_id: prj_cae4464c41
    decision: same_as
    reviewer: Bálint (antalbalint97)
    date: 2026-10-05
    evidence: >-
      The profile item reads "A reprodukcióval kapcsolatos döntések többszempontú vizsgálata európai
      összehasonlításban a (poszt)-pandémiás korszakban (MTA Lendület)" and links https://reprosoc.tk.hu/,
      the dedicated site of this Lendület research activity, not a different project. The title equals the
      canonical Project's title plus the funder note. Overrules LINKS_OTHER_PAGE. Identity decision only:
      the activity_cue research_group stays on the mention and is #9's to classify.
  - mention_id: pjm_f2ac38e263   # Herke Boglárka, szociologia profile, tk_reprosoc|https://reprosoc.tk.hu/
    project_id: prj_cae4464c41
    decision: same_as
    reviewer: Bálint (antalbalint97)
    date: 2026-10-05
    evidence: >-
      Same named Lendület research activity as the Galántai item (title equals the canonical Project's
      title plus "(MTA Lendület)"; link to its own site reprosoc.tk.hu); the project page also links
      Herke's profile (PAGE_LINKS_OWNER). Overrules LINKS_OTHER_PAGE. Identity decision only: the
      activity_cue research_group stays on the mention and is #9's to classify.
